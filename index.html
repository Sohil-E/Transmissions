<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive EM Study Application</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./module-data.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --border: #334155;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Space Grotesk", Inter, Segoe UI, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #1e293b, var(--bg) 55%);
      }
      .app { max-width: 1180px; margin: 0 auto; padding: 1rem; }
      .title { margin: 0.25rem 0 0.9rem; font-size: clamp(1.3rem, 2.5vw, 2rem); }
      .tabs, .topic-tabs, .page-nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .tab, .btn {
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        border-radius: 999px;
        padding: 0.5rem 0.95rem;
        cursor: pointer;
      }
      .tab.active { border-color: var(--accent); background: #083344; }
      .panel {
        margin-top: 0.85rem;
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem;
      }
      .small { color: var(--muted); font-size: 0.92rem; }
      .flashcard-wrap { perspective: 1000px; margin-top: 0.7rem; }
      .flashcard {
        min-height: 180px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.58s ease;
      }
      .flashcard.flipped { transform: rotateY(180deg); }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        display: grid;
        align-content: center;
        gap: 0.55rem;
        background: #0b1220;
      }
      .back { transform: rotateY(180deg); background: #082f49; }
      .button-row { display: flex; gap: 0.55rem; margin-top: 0.7rem; flex-wrap: wrap; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .question-card, .content-card, .media-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0b1220;
        padding: 0.9rem;
        margin-top: 0.7rem;
      }
      .options { display: grid; gap: 0.55rem; margin-top: 0.7rem; }
      .option {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0b1220;
        color: var(--text);
        padding: 0.65rem 0.75rem;
        text-align: left;
        cursor: pointer;
      }
      .option:disabled { cursor: default; opacity: 0.9; }
      .option.correct { border-color: #22c55e; background: rgba(34, 197, 94, 0.12); }
      .option.correct-muted { border-color: #16a34a; background: rgba(22, 163, 74, 0.08); }
      .option.incorrect { border-color: #f87171; background: rgba(248, 113, 113, 0.12); }
      .answer {
        margin-top: 0.7rem;
        border-left: 3px solid var(--accent);
        padding-left: 0.7rem;
      }
      .input {
        width: min(340px, 100%);
        margin-top: 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #111827;
        color: var(--text);
        padding: 0.5rem 0.6rem;
      }
      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 0.7rem;
        margin-top: 0.7rem;
      }
      .media-grid img { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
      .video-wrap {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        margin-top: 0.6rem;
      }
      .video-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
      }
      .wave-demo {
        margin-top: 0.75rem;
        height: 84px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: linear-gradient(90deg, #020617, #0f172a);
        overflow: hidden;
        position: relative;
      }
      .wave-demo::before {
        content: "";
        position: absolute;
        top: 22px;
        left: -25%;
        width: 150%;
        height: 40px;
        background: repeating-linear-gradient(90deg, transparent 0 20px, rgba(34, 211, 238, 0.8) 20px 30px);
        animation: travel 2.2s linear infinite;
      }
      @keyframes travel {
        from { transform: translateX(0); }
        to { transform: translateX(140px); }
      }
      a { color: #67e8f9; }
      p { line-height: 1.65; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useMemo, useState } = React;
      const QUESTION_COUNT = 120;

      function App() {
        const data = window.ModuleData;
        const [tab, setTab] = useState("flashcards");
        const [cardIndex, setCardIndex] = useState(0);
        const [flipped, setFlipped] = useState(false);
        const [topicIndex, setTopicIndex] = useState(0);
        const [pageIndex, setPageIndex] = useState(0);
        const [questionBank, setQuestionBank] = useState(() => data.generateQuestionBank(QUESTION_COUNT));
        const [questionIndex, setQuestionIndex] = useState(0);
        const [showSolution, setShowSolution] = useState(false);
        const [attempt, setAttempt] = useState("");
        const [quizIndex, setQuizIndex] = useState(0);
        const [quizSelections, setQuizSelections] = useState({});

        const allFlashcards = useMemo(() => {
          return data.topics.flatMap((topic) =>
            topic.flashcards.map((card) => ({
              ...card,
              topic: topic.title
            }))
          );
        }, [data.topics]);

        const currentCard = allFlashcards[cardIndex];
        const currentTopic = data.topics[topicIndex];
        const currentPage = currentTopic.pages[pageIndex];
        const currentQuestion = questionBank[questionIndex];
        const quizQuestions = data.quizQuestions;
        const currentQuiz = quizQuestions[quizIndex];
        const quizAttempted = useMemo(() => Object.keys(quizSelections).length, [quizSelections]);
        const quizScore = useMemo(
          () => Object.entries(quizSelections).reduce((score, [idx, selected]) => {
            return selected === quizQuestions[Number(idx)].correctAnswerIndex ? score + 1 : score;
          }, 0),
          [quizSelections, quizQuestions]
        );

        function selectOption(optionIdx) {
          if (typeof quizSelections[quizIndex] !== "undefined") return;
          setQuizSelections((prev) => ({ ...prev, [quizIndex]: optionIdx }));
        }

        return (
          <main className="app">
            <h1 className="title">Interactive EM, Transmission Lines, and Antennas Module</h1>
            <div className="tabs">
              <button className={`tab ${tab === "flashcards" ? "active" : ""}`} onClick={() => setTab("flashcards")}>Flashcards</button>
              <button className={`tab ${tab === "quiz" ? "active" : ""}`} onClick={() => setTab("quiz")}>Knowledge Check Quiz</button>
              <button className={`tab ${tab === "question-bank" ? "active" : ""}`} onClick={() => setTab("question-bank")}>Question Bank (120 Auto-Generated)</button>
              <button className={`tab ${tab === "explanations" ? "active" : ""}`} onClick={() => setTab("explanations")}>Topic Explanations</button>
            </div>

            {tab === "flashcards" && (
              <section className="panel">
                <div className="small">Card {cardIndex + 1} of {allFlashcards.length} | Topic: {currentCard.topic}</div>
                <div className="flashcard-wrap">
                  <div className={`flashcard ${flipped ? "flipped" : ""}`}>
                    <div className="face">
                      <strong>Front</strong>
                      <div>{currentCard.front}</div>
                    </div>
                    <div className="face back">
                      <strong>Back</strong>
                      <div>{currentCard.back}</div>
                    </div>
                  </div>
                </div>
                <div className="button-row">
                  <button className="btn" onClick={() => setFlipped((v) => !v)}>Flip</button>
                  <button className="btn" disabled={cardIndex === 0} onClick={() => { setCardIndex(cardIndex - 1); setFlipped(false); }}>Previous</button>
                  <button className="btn" disabled={cardIndex === allFlashcards.length - 1} onClick={() => { setCardIndex(cardIndex + 1); setFlipped(false); }}>Next</button>
                </div>
              </section>
            )}

            {tab === "quiz" && (
              <section className="panel">
                <div className="small">
                  Question {quizIndex + 1} of {quizQuestions.length} | Attempted {quizAttempted} | Score {quizScore}/{quizQuestions.length}
                </div>
                <article className="question-card">
                  <strong>{currentQuiz.question}</strong>
                  <div className="options">
                    {currentQuiz.options.map((option, idx) => {
                      const chosen = quizSelections[quizIndex];
                      const locked = typeof chosen !== "undefined";
                      const isCorrect = idx === currentQuiz.correctAnswerIndex;
                      const isSelected = chosen === idx;
                      let stateClass = "";
                      if (locked) {
                        if (isSelected && isCorrect) stateClass = "correct";
                        else if (isSelected && !isCorrect) stateClass = "incorrect";
                        else if (isCorrect) stateClass = "correct-muted";
                      }
                      return (
                        <button
                          key={idx}
                          className={`option ${stateClass}`}
                          onClick={() => selectOption(idx)}
                          disabled={locked}
                        >
                          {option}
                        </button>
                      );
                    })}
                  </div>
                  {typeof quizSelections[quizIndex] !== "undefined" && (
                    <div className="answer">
                      <div><strong>Solution steps</strong></div>
                      <ol>
                        {currentQuiz.steps.map((step, i) => <li key={i}>{step}</li>)}
                      </ol>
                    </div>
                  )}
                </article>
                <div className="button-row">
                  <button className="btn" disabled={quizIndex === 0} onClick={() => setQuizIndex(quizIndex - 1)}>Previous</button>
                  <button className="btn" disabled={quizIndex === quizQuestions.length - 1} onClick={() => setQuizIndex(quizIndex + 1)}>Next</button>
                  <button
                    className="btn"
                    onClick={() => {
                      setQuizSelections({});
                      setQuizIndex(0);
                    }}
                  >
                    Reset quiz
                  </button>
                </div>
              </section>
            )}

            {tab === "question-bank" && (
              <section className="panel">
                <div className="small">Question {questionIndex + 1} of {questionBank.length} | Topic: {currentQuestion.topic}</div>
                <article className="question-card">
                  <strong>{currentQuestion.prompt}</strong>
                  <div>
                    <input
                      className="input"
                      value={attempt}
                      onChange={(e) => setAttempt(e.target.value)}
                      placeholder="Type your answer attempt"
                    />
                  </div>
                  <div className="button-row">
                    <button className="btn" onClick={() => setShowSolution((s) => !s)}>{showSolution ? "Hide" : "Show"} answer + working</button>
                  </div>
                  {showSolution && (
                    <div className="answer">
                      <div><strong>Calculated answer:</strong> {currentQuestion.answer}</div>
                      <ol>
                        {currentQuestion.steps.map((step, i) => <li key={i}>{step}</li>)}
                      </ol>
                    </div>
                  )}
                </article>
                <div className="button-row">
                  <button className="btn" disabled={questionIndex === 0} onClick={() => { setQuestionIndex(questionIndex - 1); setShowSolution(false); setAttempt(""); }}>Previous question</button>
                  <button className="btn" disabled={questionIndex === questionBank.length - 1} onClick={() => { setQuestionIndex(questionIndex + 1); setShowSolution(false); setAttempt(""); }}>Next question</button>
                  <button
                    className="btn"
                    onClick={() => {
                      setQuestionBank(data.generateQuestionBank(QUESTION_COUNT));
                      setQuestionIndex(0);
                      setShowSolution(false);
                      setAttempt("");
                    }}
                  >
                    Regenerate all numbers
                  </button>
                </div>
              </section>
            )}

            {tab === "explanations" && (
              <section className="panel">
                <div className="topic-tabs">
                  {data.topics.map((topic, idx) => (
                    <button
                      key={topic.id}
                      className={`tab ${idx === topicIndex ? "active" : ""}`}
                      onClick={() => {
                        setTopicIndex(idx);
                        setPageIndex(0);
                      }}
                    >
                      {topic.title}
                    </button>
                  ))}
                </div>

                <article className="content-card">
                  <div className="small">{currentTopic.title} | {currentPage.title} ({pageIndex + 1}/{currentTopic.pages.length})</div>
                  {currentPage.content.map((paragraph, idx) => <p key={idx}>{paragraph}</p>)}
                </article>

                <div className="page-nav">
                  <button className="btn" disabled={pageIndex === 0} onClick={() => setPageIndex(pageIndex - 1)}>Previous page</button>
                  <button className="btn" disabled={pageIndex === currentTopic.pages.length - 1} onClick={() => setPageIndex(pageIndex + 1)}>Next page</button>
                </div>

                <div className="wave-demo" title="Animated wave demonstration"></div>

                <div className="media-grid">
                  {currentTopic.media.images.map((image, idx) => (
                    <article key={idx} className="media-card">
                      <strong>{image.title}</strong>
                      <img src={image.url} alt={image.title} />
                      <div className="small">Source: {image.source}</div>
                    </article>
                  ))}
                  {currentTopic.media.animations.map((anim, idx) => (
                    <article key={idx} className="media-card">
                      <strong>{anim.title}</strong>
                      <p className="small">Interactive animation link for this topic.</p>
                      <a href={anim.url} target="_blank" rel="noreferrer">Open animation</a>
                    </article>
                  ))}
                </div>

                {currentTopic.media.videos.map((video, idx) => (
                  <article key={idx} className="media-card">
                    <strong>{video.title}</strong>
                    <div className="video-wrap">
                      <iframe
                        src={`https://www.youtube.com/embed/${video.youtubeId}`}
                        title={video.title}
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowFullScreen
                      />
                    </div>
                  </article>
                ))}
              </section>
            )}
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
